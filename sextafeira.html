<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SextaFeira</title>
<style>
  :root{
    --bg: #050a10;
    --bg-panel: rgba(9, 24, 32, 0.55);
    --cyan: #4df3ff;
    --cyan-dim: #1c6b78;
    --cyan-glow: rgba(77, 243, 255, 0.35);
    --magenta: #ff5ee8;
    --text: #dffbff;
    --text-dim: #6fa8b3;
  }
  *{ box-sizing: border-box; }
  html, body{
    margin:0; padding:0; height:100%;
    background: var(--bg);
    color: var(--text);
    font-family: "Consolas", "SF Mono", "Courier New", monospace;
    overflow: hidden;
  }

  /* Fundo com grade holográfica e scanlines */
  body::before{
    content:"";
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(77,243,255,0.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(77,243,255,0.06) 1px, transparent 1px);
    background-size: 34px 34px;
    -webkit-mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 75%);
            mask-image: radial-gradient(ellipse at 50% 30%, black 0%, transparent 75%);
    pointer-events: none;
    z-index: 0;
  }
  body::after{
    content:"";
    position: fixed; inset: 0;
    background: repeating-linear-gradient(
      to bottom,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(77,243,255,0.025) 3px,
      rgba(0,0,0,0) 4px
    );
    pointer-events: none;
    z-index: 999;
  }

  .app{
    position: relative; z-index: 1;
    display:flex; flex-direction:column;
    height:100vh; max-width: 580px; margin: 0 auto;
  }

  /* Cabeçalho */
  .header{
    display:flex; align-items:center; gap:16px;
    padding: 22px 22px 16px;
    flex-shrink:0;
  }
  .core{
    width: 54px; height: 54px;
    flex-shrink:0;
    position: relative;
  }
  .core-ring{
    position:absolute; inset:0;
    border-radius:50%;
    border: 1.5px solid var(--cyan);
    box-shadow: 0 0 12px var(--cyan-glow), inset 0 0 12px var(--cyan-glow);
    animation: spin 6s linear infinite;
  }
  .core-ring.r2{
    inset: 8px;
    border-color: var(--magenta);
    border-style: dashed;
    animation: spin 4s linear infinite reverse;
    opacity: 0.7;
  }
  .core-dot{
    position:absolute; inset: 20px;
    border-radius:50%;
    background: radial-gradient(circle at 35% 35%, #fff, var(--cyan) 40%, var(--cyan-dim) 100%);
    box-shadow: 0 0 18px var(--cyan-glow);
    animation: pulseCore 2.2s ease-in-out infinite;
  }
  @keyframes spin{ from{ transform: rotate(0deg); } to{ transform: rotate(360deg); } }
  @keyframes pulseCore{
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.15); }
  }
  .header-text h1{
    font-weight: 600;
    font-size: 21px;
    margin:0;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
    text-shadow: 0 0 10px var(--cyan-glow);
  }
  .header-text p{
    margin:3px 0 0; font-size:11.5px; color: var(--text-dim);
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .header-text p::before{
    content: "● ";
    color: #4dff8c;
  }

  /* Área de mensagens */
  .messages{
    flex:1; overflow-y:auto;
    padding: 10px 22px 20px;
    display:flex; flex-direction:column; gap:16px;
  }
  .msg{
    max-width: 85%;
    padding: 13px 16px;
    line-height: 1.5;
    font-size: 14px;
    border-radius: 4px;
    position: relative;
    backdrop-filter: blur(6px);
  }
  .msg .tag{
    display:block;
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 5px;
    opacity: 0.65;
  }
  .msg.assistant{
    align-self:flex-start;
    background: var(--bg-panel);
    border: 1px solid var(--cyan-dim);
    box-shadow: 0 0 14px rgba(77,243,255,0.08), inset 0 0 20px rgba(77,243,255,0.04);
    color: var(--text);
  }
  .msg.assistant .tag{ color: var(--cyan); }
  .msg.user{
    align-self:flex-end;
    background: rgba(255, 94, 232, 0.07);
    border: 1px solid rgba(255,94,232,0.35);
    box-shadow: 0 0 14px rgba(255,94,232,0.08);
    color: var(--text);
  }
  .msg.user .tag{ color: var(--magenta); }
  .msg.assistant.thinking{
    color: var(--text-dim);
  }
  .msg.assistant.thinking .tag{ opacity: 0.4; }

  /* Barra inferior */
  .composer{
    flex-shrink:0;
    margin: 0 22px 22px;
    display:flex; align-items:flex-end; gap:10px;
    background: var(--bg-panel);
    border: 1px solid var(--cyan-dim);
    border-radius: 6px;
    padding: 10px 10px 10px 16px;
    box-shadow: 0 0 18px rgba(77,243,255,0.07);
  }
  .composer textarea{
    flex:1;
    resize:none;
    background: transparent;
    border: none;
    color: var(--text);
    padding: 6px 0;
    font-size: 14px;
    font-family: inherit;
    max-height: 120px;
    outline: none;
  }
  .composer textarea::placeholder{ color: var(--text-dim); }
  .icon-btn{
    width: 40px; height: 40px;
    border-radius: 50%;
    border: 1px solid var(--cyan-dim);
    background: rgba(77,243,255,0.05);
    color: var(--cyan);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    flex-shrink:0;
    font-size: 16px;
    transition: all 0.15s;
  }
  .icon-btn:active{ transform: scale(0.92); }
  .icon-btn.send{
    background: var(--cyan);
    border-color: var(--cyan);
    color: #04141a;
    box-shadow: 0 0 12px var(--cyan-glow);
  }
  .icon-btn.mic.listening{
    background: var(--magenta);
    border-color: var(--magenta);
    color: #1a0414;
    box-shadow: 0 0 12px rgba(255,94,232,0.5);
    animation: pulseBtn 1.2s infinite;
  }
  @keyframes pulseBtn{
    0%   { box-shadow: 0 0 0 0 rgba(255,94,232,0.45); }
    70%  { box-shadow: 0 0 0 14px rgba(255,94,232,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,94,232,0); }
  }
</style>
</head>
<body>

<div class="app">

  <div class="header">
    <div class="core">
      <div class="core-ring"></div>
      <div class="core-ring r2"></div>
      <div class="core-dot"></div>
    </div>
    <div class="header-text">
      <h1>SextaFeira</h1>
      <p id="status-line">sistema online</p>
    </div>
  </div>

  <div class="messages" id="messages">
    <div class="msg assistant">
      <span class="tag">SextaFeira</span>
      Olá. Sistemas ativos — agenda, e-mail e clima conectados. Pode digitar ou tocar no microfone para falar comigo.
    </div>
  </div>

  <div class="composer">
    <button class="icon-btn mic" id="micBtn" title="Falar">🎤</button>
    <textarea id="input" rows="1" placeholder="transmitir mensagem..."></textarea>
    <button class="icon-btn send" id="sendBtn" title="Enviar">➤</button>
  </div>

</div>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const micBtn = document.getElementById('micBtn');
const statusLine = document.getElementById('status-line');

function addMessage(text, who, label){
  const div = document.createElement('div');
  div.className = 'msg ' + who;
  const tag = document.createElement('span');
  tag.className = 'tag';
  tag.textContent = label;
  const body = document.createElement('div');
  body.textContent = text;
  div.appendChild(tag);
  div.appendChild(body);
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
  return div;
}

const BACKEND_URL = "https://sextafeira-kvyc.onrender.com";
const APP_KEY = "Asdf0987";

async function getAssistantReply(userText){
  const resp = await fetch(BACKEND_URL + "/api/chat", {
    method: "POST",
    headers: {
      "Content-Type": "application/json",
      "x-app-key": APP_KEY
    },
    body: JSON.stringify({ message: userText })
  });
  if(!resp.ok){
    const err = await resp.json().catch(() => ({}));
    throw new Error(err.error || ("Erro " + resp.status));
  }
  const data = await resp.json();
  return data.reply;
}

async function handleSend(){
  const text = inputEl.value.trim();
  if(!text) return;
  addMessage(text, 'user', 'Você');
  inputEl.value = '';
  inputEl.style.height = 'auto';

  const thinkingEl = addMessage('processando...', 'assistant thinking', 'SextaFeira');
  try {
    const reply = await getAssistantReply(text);
    thinkingEl.remove();
    addMessage(reply, 'assistant', 'SextaFeira');
    speak(reply);
  } catch (err) {
    thinkingEl.remove();
    addMessage('Falha na conexão com o servidor: ' + err.message, 'assistant', 'SextaFeira');
  }
}

sendBtn.addEventListener('click', handleSend);
inputEl.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' && !e.shiftKey){
    e.preventDefault();
    handleSend();
  }
});
inputEl.addEventListener('input', () => {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
});

const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
let recognition = null;
let listening = false;

if(SpeechRecognition){
  recognition = new SpeechRecognition();
  recognition.lang = 'pt-BR';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  recognition.onstart = () => {
    listening = true;
    micBtn.classList.add('listening');
    statusLine.textContent = 'recebendo áudio...';
  };
  recognition.onend = () => {
    listening = false;
    micBtn.classList.remove('listening');
    statusLine.textContent = 'sistema online';
  };
  recognition.onerror = () => {
    listening = false;
    micBtn.classList.remove('listening');
    statusLine.textContent = 'falha no áudio, tente novamente';
  };
  recognition.onresult = (event) => {
    const said = event.results[0][0].transcript;
    inputEl.value = said;
    handleSend();
  };

  micBtn.addEventListener('click', () => {
    if(listening){
      recognition.stop();
    } else {
      recognition.start();
    }
  });
} else {
  micBtn.addEventListener('click', () => {
    statusLine.textContent = 'áudio indisponível neste navegador';
  });
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'pt-BR';
  utter.rate = 1.0;
  window.speechSynthesis.cancel();
  window.speechSynthesis.speak(utter);
}
</script>

</body>
</html>
